# OpenShell policy preset for the signl Kalshi trading bot.
#
# Apply with:
#     openshell policy set ~/kalshi-signl/policies/kalshi.yaml
#
# Allows python3 to reach exactly the endpoints signl needs:
#   * Kalshi REST    - trading.kalshi.com, demo-api.kalshi.co (/trade-api/v2/**)
#   * Nemotron       - integrate.api.nvidia.com  (POST chat/completions)
#   * Brave Search   - api.search.brave.com      (news + web search)
#   * Telegram bridge - api.telegram.org          (/bot*/**)
#
# Filesystem: read-write inside the workspace and a couple of cache dirs;
# everything else is read-only or default-denied by OpenShell.

version: 1

preset:
  name: kalshi
  description: "signl Kalshi trading bot - Kalshi + Nemotron + Brave + Telegram"

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /etc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox/.openclaw
    - /sandbox/.openclaw/skills/kalshi-trader
    - /sandbox/.nemoclaw

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:

  # ── Kalshi REST API (demo + production hostnames) ────────────────────
  kalshi:
    name: kalshi
    endpoints:
      - host: demo-api.kalshi.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,    path: "/trade-api/v2/**" }
          - allow: { method: POST,   path: "/trade-api/v2/**" }
          - allow: { method: DELETE, path: "/trade-api/v2/**" }
      - host: trading.kalshi.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,    path: "/trade-api/v2/**" }
          - allow: { method: POST,   path: "/trade-api/v2/**" }
          - allow: { method: DELETE, path: "/trade-api/v2/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── NVIDIA Nemotron (OpenAI-compatible) ──────────────────────────────
  nvidia_inference:
    name: nvidia_inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/v1/completions" }
          - allow: { method: GET,  path: "/v1/models" }
          - allow: { method: GET,  path: "/v1/models/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── Brave Search (news + web fallback for sentiment.search_news) ─────
  brave_search:
    name: brave_search
    endpoints:
      - host: api.search.brave.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/res/v1/news/search" }
          - allow: { method: GET, path: "/res/v1/web/search" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── Telegram (OpenClaw bridge runs in node; python3 may also push) ───
  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET,  path: "/file/bot*/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

# Everything else (DNS over HTTPS, package mirrors, GitHub, etc.) is denied
# by OpenShell's default-deny stance for any binary not listed above.
