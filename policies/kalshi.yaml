# OpenShell policy for the signl Kalshi trading bot — secured by NemoClaw.
#
# Apply with:
#   openshell policy set --policy ~/kalshi-signl/policies/kalshi.yaml trader
#
# Network: only the five whitelisted hosts below are reachable; everything
# else is denied by OpenShell's default-deny stance.
#
# Filesystem: read-write only inside ~/kalshi-signl/sandbox/.
# Sensitive paths (~/.ssh, ~/.aws, ~/.gnupg) are never granted read_only
# or read_write access, so landlock blocks them automatically.
#
# Process: python3 only — binary-scoped per network policy block.
#
# Max position size: 100 contracts / order, 5 % of balance / trade.
# Enforced in code by sandbox/workspace/guardrails.py.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /home/ubuntu/kalshi-signl/sandbox/
    - /tmp
    - /dev/null
    - /sandbox/.openclaw
    - /sandbox/.nemoclaw

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:

  # ── Kalshi REST API (demo + production) ──────────────────────────────────
  kalshi:
    name: kalshi
    endpoints:
      - host: demo-api.kalshi.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,    path: "/trade-api/v2/**" }
          - allow: { method: POST,   path: "/trade-api/v2/**" }
          - allow: { method: DELETE, path: "/trade-api/v2/**" }
      - host: trading.kalshi.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,    path: "/trade-api/v2/**" }
          - allow: { method: POST,   path: "/trade-api/v2/**" }
          - allow: { method: DELETE, path: "/trade-api/v2/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── NVIDIA Nemotron (OpenAI-compatible inference) ────────────────────────
  nvidia_inference:
    name: nvidia_inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/v1/completions" }
          - allow: { method: GET,  path: "/v1/models" }
          - allow: { method: GET,  path: "/v1/models/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── Brave Search (news + web for sentiment pipeline) ─────────────────────
  brave_search:
    name: brave_search
    endpoints:
      - host: api.search.brave.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/res/v1/news/search" }
          - allow: { method: GET, path: "/res/v1/web/search" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # ── Telegram (trade alerts and blocked-order notifications) ──────────────
  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET,  path: "/file/bot*/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
